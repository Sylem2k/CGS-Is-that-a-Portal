// CGS Portal Gun custom secondary-fire binding.
// Blue remains on the proven vanilla CharacterFire action (left click).
// Orange gets its own right-click action to avoid using vanilla ADS.
ActionManager {
 Actions {
  Action CGSPortalGunOrange {
   Type Digital
   InputSource InputSourceSum "{6AB21D161F2E7520}" {
    Sources {
     InputSourceValue "{6AB21D161F2E7521}" {
      Input "mouse:button1"
      Filter InputFilterPressed "{6AB21D161F2E7522}" {
      }
     }
     InputSourceValue "{6AB21D161F2E7523}" {
      Input "gamepad0:left_trigger"
      Filter InputFilterPressed "{6AB21D161F2E7524}" {
      }
     }
    }
   }
  }
 }
 Contexts {
  ActionContext CGSPortalGunContext {
   Priority 10100
   Flags 2
   ActionRefs {
    "CGSPortalGunOrange"
   }
  }
 }
}
