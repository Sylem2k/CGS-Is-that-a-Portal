//------------------------------------------------------------------------------------------------
// CGS Portal Gun input context.
//
// Loaded by Enfusion's standard chimeraInputCommon.conf resource merge.
// Activate this context ONLY while the CGS Portal Gun is held and a menu
// is not open. Higher priority than normal CharacterFire and ADS.
//
// mouse:button0 = LMB = Blue; mouse:button1 = RMB = Orange.
// Gamepad: right trigger Blue, left trigger Orange.
//------------------------------------------------------------------------------------------------
ActionManager {
 Actions {
  Action CGSPortalGunBlue {
   Type Digital
   InputSource InputSourceSum "{6AB21D161F2E7510}" {
    Sources {
     InputSourceValue "{6AB21D161F2E7511}" {
      Input "mouse:button0"
      Filter InputFilterPressed "{6AB21D161F2E7512}" {
      }
     }
     InputSourceValue "{6AB21D161F2E7513}" {
      Input "gamepad0:right_trigger"
      Filter InputFilterPressed "{6AB21D161F2E7514}" {
      }
     }
    }
   }
  }
  Action CGSPortalGunOrange {
   Type Digital
   InputSource InputSourceSum "{6AB21D161F2E7520}" {
    Sources {
     InputSourceValue "{6AB21D161F2E7521}" {
      Input "mouse:button1"
      Filter InputFilterPressed "{6AB21D161F2E7522}" {
      }
     }
     InputSourceValue "{6AB21D161F2E7523}" {
      Input "gamepad0:left_trigger"
      Filter InputFilterPressed "{6AB21D161F2E7524}" {
      }
     }
    }
   }
  }
 }
 Contexts {
  ActionContext CGSPortalGunContext {
   Priority 9000
   Flags 2
   ActionRefs {
    "CGSPortalGunBlue"
    "CGSPortalGunOrange"
   }
  }
 }
}
