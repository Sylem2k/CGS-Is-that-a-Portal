// CGS Portal Gun - dedicated Orange secondary fire.
//
// Inherit the BASE Reforger input set instead of replacing it.
// The project points InputManagerSettings.Default at this resource:
// GameProject -> GameProjectConfig PC -> InputManagerSettings.
// We retain vanilla CharacterFire (LMB Blue), normal weapon ADS (RMB),
// movement, menus, VON and all other default actions.
//
// Middle mouse (mouse:button2) fires Orange when Portal Gun is held.
// Hold F to grab/carry, release F to drop. Press V while holding F to throw.
// G remains free for radio; J is no longer bound by this addon.
ActionManager : "{795184CF9AD764DB}Configs/System/chimeraInputCommon.conf" {
 Actions {
  Action CGSPortalGunOrange {
   Type Digital
   InputSource InputSourceSum "{6AB21D161F2E7520}" {
    Sources {
     InputSourceValue "{6AB21D161F2E7521}" {
      Input "mouse:button2"
      Filter InputFilterPressed "{6AB21D161F2E7522}" {
      }
     }
     InputSourceValue "{6AB21D161F2E7523}" {
      Input "gamepad0:left_trigger"
      Filter InputFilterPressed "{6AB21D161F2E7524}" {
      }
     }
    }
   }
  }
  Action CGSPortalGunGrab {
   Type Digital
   InputSource InputSourceSum "{6AB21D161F2E75A0}" {
    Sources {
     InputSourceValue "{6AB21D161F2E75A1}" {
      Input "keyboard:KC_F"
     }
    }
   }
  }  Action CGSPortalGunThrow {
   Type Digital
   InputSource InputSourceSum "{6AB21D161F2E75B0}" {
    Sources {
     InputSourceValue "{6AB21D161F2E75B1}" {
      Input "keyboard:KC_V"
     }
    }
   }
  }

 }
 Contexts {
  ActionContext CGSPortalGunContext {
   Priority 10100
   Flags 2
   ActionRefs {
    "CGSPortalGunOrange"
    "CGSPortalGunGrab"
    "CGSPortalGunThrow"
   }
  }
 }
}
